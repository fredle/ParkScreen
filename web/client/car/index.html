<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>ParkScreen</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:20px system-ui,sans-serif}
  #ui{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:0 24px}
  input,button{font:inherit;padding:12px 20px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
  input{width:8ch;text-align:center;letter-spacing:.3em}
  button{background:#2a6df4;border-color:#2a6df4}
  button.secondary{background:#222;border-color:#555}
  video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
  #bar{position:fixed;top:8px;right:8px;display:flex;gap:8px}
  #bar button{opacity:.35;padding:6px 12px;font-size:14px;background:#222;border-color:#555}
  #bar button:active,#bar button:hover{opacity:1}
  .warn{color:#fb4;font-size:16px;max-width:36em}
  pre{font-size:14px;text-align:left;color:#9c9}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="ui"></div>
<video id="v" autoplay playsinline muted hidden disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback"></video>
<div id="bar" hidden><button id="full">Full screen</button><button id="stop">Disconnect</button></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
