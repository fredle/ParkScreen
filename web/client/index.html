<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkScreen</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:20px system-ui,sans-serif}
  #ui{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;padding:0 24px}
  input,button{font:inherit;padding:12px 20px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
  input{width:8ch;text-align:center;letter-spacing:.3em}
  button{background:#2a6df4;border-color:#2a6df4}
  video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
  .warn{color:#fb4;font-size:16px;max-width:36em}
  pre{font-size:14px;text-align:left;color:#9c9}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="ui"></div>
<video id="v" autoplay playsinline muted hidden></video>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
