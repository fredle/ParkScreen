[package]
name = "parkscreen-host"
version = "0.1.0"
edition = "2021"
description = "ParkScreen host agent: captures a Windows monitor and streams it over WebRTC"

[[bin]]
name = "parkscreen-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
openh264 = "0.9"
rand = "0.9"
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.21"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_HiDpi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage",
]

[profile.release]
lto = "thin"
opt-level = 3
