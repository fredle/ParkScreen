<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ParkScreen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 16px system-ui, sans-serif; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
  #start button { font-size: 28px; padding: 18px 56px; border-radius: 12px; border: 0; background: #3b82f6; color: #fff; }
  #warn { max-width: 34em; color: #f5c451; font-size: 15px; }
  #status { color: #9aa; min-height: 1.4em; }
  #stats { position: fixed; left: 8px; bottom: 8px; font: 12px ui-monospace, monospace; color: #8f8; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; display: none; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="start">
  <h1 style="margin:0">ParkScreen</h1>
  <div id="warn">Use only while parked. The car blocks video in gear, and ParkScreen will not work around that.</div>
  <button id="go">Connect</button>
  <div id="status"></div>
</div>
<video id="v" autoplay muted playsinline></video>
<div id="stats"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('v'), startEl = $('start'), statusEl = $('status'), statsEl = $('stats');
  let pc = null, statsTimer = null, retryTimer = null, wantConnected = false;

  const setStatus = t => { statusEl.textContent = t; };

  async function connect() {
    teardown();
    setStatus('Connecting…');
    pc = new RTCPeerConnection({ iceServers: [] });
    const tr = pc.addTransceiver('video', { direction: 'recvonly' });
    try { // Prefer H.264 (what the host sends) so negotiation never lands on something else.
      const caps = RTCRtpReceiver.getCapabilities('video').codecs;
      const h264 = caps.filter(c => /h264/i.test(c.mimeType));
      if (h264.length) tr.setCodecPreferences(h264);
    } catch (e) { console.warn('setCodecPreferences', e); }
    pc.addEventListener('track', e => {
      video.srcObject = e.streams[0] || new MediaStream([e.track]);
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
      try { e.receiver.playoutDelayHint = 0; } catch (_) {}
      startEl.style.display = 'none';
      video.style.display = 'block';
      video.play().catch(() => {});
      startStats(e.receiver);
    });
    pc.addEventListener('connectionstatechange', () => {
      if (!wantConnected) return;
      if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) scheduleRetry();
    });

    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); res(); } };
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(res, 3000);
    });

    const dpr = window.devicePixelRatio || 1;
    const body = {
      type: pc.localDescription.type,
      sdp: pc.localDescription.sdp,
      width: Math.round(screen.width * dpr),
      height: Math.round(screen.height * dpr),
    };
    const r = await fetch('/api/offer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text() || ('HTTP ' + r.status));
    const ans = await r.json();
    await pc.setRemoteDescription(ans);
  }

  function teardown() {
    clearInterval(statsTimer); statsTimer = null;
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
  }

  function scheduleRetry() {
    if (retryTimer) return;
    setStatus('Connection lost, retrying…');
    teardown();
    video.style.display = 'none'; startEl.style.display = 'flex';
    retryTimer = setTimeout(() => { retryTimer = null; start(); }, 1500);
  }

  async function start() {
    wantConnected = true;
    try { await connect(); }
    catch (e) { console.error(e); setStatus('Failed: ' + e.message); scheduleRetry(); }
  }

  function startStats(receiver) {
    let last = null;
    statsTimer = setInterval(async () => {
      const rep = await pc.getStats(receiver.track);
      rep.forEach(s => {
        if (s.type !== 'inbound-rtp') return;
        if (last) {
          const dt = (s.timestamp - last.timestamp) / 1000;
          const fps = (s.framesDecoded - last.framesDecoded) / dt;
          const mbps = (s.bytesReceived - last.bytesReceived) * 8 / dt / 1e6;
          const dec = s.totalDecodeTime && s.framesDecoded ? (1000 * (s.totalDecodeTime - last.totalDecodeTime) / Math.max(1, s.framesDecoded - last.framesDecoded)) : 0;
          statsEl.textContent = `${s.frameWidth}x${s.frameHeight}  ${fps.toFixed(0)} fps  ${mbps.toFixed(1)} Mbps  decode ${dec.toFixed(1)} ms  lost ${s.packetsLost}  dropped ${s.framesDropped || 0}`;
        }
        last = s;
      });
    }, 1000);
  }

  $('go').addEventListener('click', async () => {
    try { await document.documentElement.requestFullscreen(); } catch (_) {}
    start();
  });
  // Two-finger tap / double click toggles the stats overlay.
  const toggleStats = () => { statsEl.style.display = statsEl.style.display === 'block' ? 'none' : 'block'; };
  video.addEventListener('dblclick', toggleStats);
  video.addEventListener('touchstart', e => { if (e.touches.length === 2) toggleStats(); });
})();
</script>
</body>
</html>
