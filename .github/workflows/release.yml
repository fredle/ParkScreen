name: Release host agent

# Modelled on the Teeline release workflow (fredle/transcriber). UNTESTED: it has not run yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - name: Determine tag and version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Build the host agent
        shell: pwsh
        env:
          # Baked into the binary (see host/src/main.rs); the Cloud Run URL of parkscreen-server.
          PARKSCREEN_SERVER_URL: ${{ vars.PARKSCREEN_SERVER_URL }}
        run: |
          cargo build --release -p parkscreen-host
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target\release\parkscreen-host.exe stage\

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=${{ steps.version.outputs.tag }}" --jq .body > notes.md

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Download previous releases (for delta packages)
        shell: pwsh
        run: |
          vpk download http --url "https://parkscreen-releases.web.app/" --outputDir Releases --channel win
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release (first release?)." }
          exit 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign parkscreen-host.exe (Azure Trusted Signing)
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT || 'leatham-signing-account' }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE || 'cert-profile' }}
          files-folder: ${{ github.workspace }}\stage
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack release (Velopack)
        shell: pwsh
        run: |
          vpk pack `
            --packId ParkScreen `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir stage `
            --runtime win-x64 `
            --mainExe parkscreen-host.exe `
            --packTitle ParkScreen `
            --packAuthors "FBL Consulting Ltd" `
            --releaseNotes notes.md `
            --outputDir Releases

      - name: Sign the installer (Azure Trusted Signing)
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT || 'leatham-signing-account' }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE || 'cert-profile' }}
          files-folder: ${{ github.workspace }}\Releases
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Add versioned release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Releases\notes" | Out-Null
          Copy-Item notes.md "Releases\notes\${{ steps.version.outputs.version }}.md"

      - name: GCP login (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy the release feed to Firebase Hosting
        shell: bash
        run: |
          npx firebase-tools@15 deploy --only hosting:parkscreen-releases \
            --project ${{ vars.FIREBASE_PROJECT_ID }} \
            --non-interactive
