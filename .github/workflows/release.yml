name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    environment: release
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: host
        run: cargo build --release

      - name: Run tests
        working-directory: host
        run: cargo test --release

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Trusted Signing client
        run: |
          New-Item -ItemType Directory -Force -Path trustedsigning | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile trustedsigning\client.nupkg
          Expand-Archive -Path trustedsigning\client.nupkg -DestinationPath trustedsigning\extracted -Force

      - name: Write signing metadata
        run: |
          @'
          {
            "Endpoint": "https://weu.codesigning.azure.net/",
            "CodeSigningAccountName": "leatham-signing-account",
            "CertificateProfileName": "cert-profile"
          }
          '@ | Set-Content -Path trustedsigning\metadata.json -Encoding utf8

      - name: Locate signtool
        run: |
          $signtool = Get-ChildItem -Recurse -Filter "signtool.exe" "C:\Program Files (x86)\Windows Kits\10\bin" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign parkscreen-host.exe
        run: |
          $repoAbs = (Resolve-Path ".").Path
          & $env:SIGNTOOL sign /v /debug /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib "$repoAbs\trustedsigning\extracted\bin\x64\Azure.CodeSigning.Dlib.dll" `
            /dmdf "$repoAbs\trustedsigning\metadata.json" `
            host\target\release\parkscreen-host.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          & $env:SIGNTOOL verify /pa /v host\target\release\parkscreen-host.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }

      - name: Publish GitHub Release
        run: |
          gh release create "$env:GITHUB_REF_NAME" host\target\release\parkscreen-host.exe --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
