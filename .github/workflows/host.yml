name: host
on:
  push:
    paths: [ "host/**", "protocol/**", "server/**", "Cargo.toml", "Cargo.lock", ".github/workflows/host.yml" ]
  pull_request:
    paths: [ "host/**", "protocol/**", "server/**", "Cargo.toml", "Cargo.lock", ".github/workflows/host.yml" ]
jobs:
  build:
    # The host agent has Windows-only backends (Desktop Duplication, Media Foundation), so it
    # is built and tested on Windows. The Linux `ci` workflow covers the portable core.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p parkscreen-host --all-targets --no-deps -- -D warnings
      - run: cargo test -p parkscreen-host
      - run: cargo build --release -p parkscreen-host
      - uses: actions/upload-artifact@v4
        with:
          name: parkscreen-host
          path: target/release/parkscreen-host.exe
