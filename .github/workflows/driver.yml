name: driver
on:
  push:
    branches: [main]
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  pull_request:
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# One publish at a time, so the rolling release is never half replaced.
concurrency: driver-${{ github.ref }}

jobs:
  build:
    # The display driver needs Visual Studio and the Windows Driver Kit (WDK) headers and libraries.
    # The windows-2022 runner image has both, but not the kit's Visual Studio extension, so the
    # project is a plain DLL project that adds the UMDF and IddCx paths itself (see the vcxproj).
    runs-on: windows-2022
    # Signing needs the Azure variables of the "release" environment; pull requests only build.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    env:
      # 0.1.<run number>: monotonic, and stamped into the INF so Windows treats newer builds as upgrades.
      DRIVER_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build driver
        run: msbuild driver/ParkScreenIdd/ParkScreenIdd.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Stage the driver package
        # stampinf fills in the architecture, driver date and version, and the UMDF version
        # ($UMDFVERSION$).
        shell: pwsh
        run: |
          $out = "driver/ParkScreenIdd/x64/Release"
          $pkg = "$out/ParkScreenIdd"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$out/ParkScreenIdd.dll" $pkg
          Copy-Item "driver/ParkScreenIdd/ParkScreenIdd.inf" $pkg
          $stampinf = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin") -Recurse -Filter stampinf.exe |
            Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if (-not $stampinf) { throw "stampinf.exe not found" }
          $date = (Get-Date).ToUniversalTime().ToString("MM/dd/yyyy")
          & $stampinf.FullName -f "$pkg/ParkScreenIdd.inf" -d $date -a amd64 -v "$env:DRIVER_VERSION.0" -u 2.25.0
          if ($LASTEXITCODE -ne 0) { throw "stampinf failed" }
          Get-Content "$pkg/ParkScreenIdd.inf" | Select-String "DriverVer", "UmdfLibraryVersion"
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The DLL is signed first because the catalog holds its hash. Azure Trusted Signing is not a
      # Microsoft (attestation) signature, so Windows shows its "install this device software?"
      # publisher prompt once; test-signing mode is not needed (see driver/README.md).
      - name: Sign ParkScreenIdd.dll (Azure Trusted Signing)
        if: github.event_name != 'pull_request'
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT || 'leatham-signing-account' }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE || 'cert-profile' }}
          files-folder: ${{ github.workspace }}\driver\ParkScreenIdd\x64\Release\ParkScreenIdd
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Make the catalog
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $inf2cat = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin") -Recurse -Filter Inf2Cat.exe |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $inf2cat) { throw "Inf2Cat.exe not found" }
          $pkg = (Resolve-Path "driver/ParkScreenIdd/x64/Release/ParkScreenIdd").Path
          & $inf2cat.FullName /driver:$pkg /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed" }
          if (-not (Test-Path "$pkg/ParkScreenIdd.cat")) { throw "Inf2Cat did not produce ParkScreenIdd.cat" }

      - name: Sign ParkScreenIdd.cat (Azure Trusted Signing)
        if: github.event_name != 'pull_request'
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT || 'https://weu.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT || 'leatham-signing-account' }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE || 'cert-profile' }}
          files-folder: ${{ github.workspace }}\driver\ParkScreenIdd\x64\Release\ParkScreenIdd
          files-folder-filter: cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $pkg = (Resolve-Path "driver/ParkScreenIdd/x64/Release/ParkScreenIdd").Path
          foreach ($f in "ParkScreenIdd.dll", "ParkScreenIdd.cat") {
            $s = Get-AuthenticodeSignature "$pkg/$f"
            Write-Host "$f : $($s.Status) / $($s.SignerCertificate.Subject)"
            if ($s.Status -ne "Valid") { throw "$f is not validly signed ($($s.Status))" }
          }

      - name: Build the zip and manifest
        shell: pwsh
        run: |
          $pkg = (Resolve-Path "driver/ParkScreenIdd/x64/Release/ParkScreenIdd").Path
          Copy-Item "driver/install.ps1" $pkg
          $dist = Join-Path $env:RUNNER_TEMP "driver-dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $zip = Join-Path $dist "ParkScreenIdd.zip"
          Compress-Archive -Path "$pkg/ParkScreenIdd.dll", "$pkg/ParkScreenIdd.inf", "$pkg/ParkScreenIdd.cat", "$pkg/install.ps1" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version    = $env:DRIVER_VERSION
            url        = "https://github.com/${{ github.repository }}/releases/download/driver/ParkScreenIdd.zip"
            sha256     = $sha
            testSigned = $false
            minHost    = "0.1.9"
          }
          ($manifest | ConvertTo-Json -Compress) | Set-Content (Join-Path $dist "driver-manifest.json") -Encoding ASCII
          Get-Content (Join-Path $dist "driver-manifest.json")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object { "$($_.FullName)  $($_.Length)" }
          "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: parkscreen-idd-signed
          path: |
            ${{ env.DIST }}
            driver/ParkScreenIdd/x64/Release/ParkScreenIdd.pdb
          if-no-files-found: error

      - name: Publish the rolling "driver" release
        # Only from main (never a pull request); the host app reads driver-manifest.json from here.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "ParkScreen display driver $env:DRIVER_VERSION (built from $env:GITHUB_SHA), signed with Azure Trusted Signing. See driver/README.md."
          gh release view driver --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create driver --repo $env:GITHUB_REPOSITORY --title "ParkScreen display driver" --notes $notes --latest=false --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          } else {
            gh release edit driver --repo $env:GITHUB_REPOSITORY --title "ParkScreen display driver" --notes $notes --prerelease=false --latest=false
          }
          gh release upload driver --repo $env:GITHUB_REPOSITORY --clobber "$env:DIST/ParkScreenIdd.zip" "$env:DIST/driver-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "could not upload the assets" }
