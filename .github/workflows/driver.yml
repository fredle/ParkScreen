name: driver
on:
  push:
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  pull_request:
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  workflow_dispatch:
jobs:
  build:
    # The display driver needs Visual Studio and the Windows Driver Kit (WDK) headers and libraries.
    # The windows-2022 runner image has both, but not the kit's Visual Studio extension, so the
    # project is a plain DLL project that adds the UMDF and IddCx paths itself (see the vcxproj).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build driver
        run: msbuild driver/ParkScreenIdd/ParkScreenIdd.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      - name: Stage the driver package
        # stampinf fills in the architecture, driver date and version, and the UMDF version
        # ($UMDFVERSION$). The package is not signed or catalogued: signing is a separate step.
        shell: pwsh
        run: |
          $out = "driver/ParkScreenIdd/x64/Release"
          $pkg = "$out/ParkScreenIdd"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$out/ParkScreenIdd.dll" $pkg
          Copy-Item "driver/ParkScreenIdd/ParkScreenIdd.inf" $pkg
          $stampinf = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin") -Recurse -Filter stampinf.exe |
            Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if (-not $stampinf) { throw "stampinf.exe not found" }
          & $stampinf.FullName -f "$pkg/ParkScreenIdd.inf" -d "*" -a amd64 -v "*" -u 2.25.0
          if ($LASTEXITCODE -ne 0) { throw "stampinf failed" }
          Get-Content "$pkg/ParkScreenIdd.inf" | Select-String "DriverVer", "UmdfLibraryVersion"
          Get-ChildItem $pkg | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: parkscreen-idd-unsigned
          path: |
            driver/ParkScreenIdd/x64/Release/ParkScreenIdd/
            driver/ParkScreenIdd/x64/Release/ParkScreenIdd.pdb
          if-no-files-found: error
