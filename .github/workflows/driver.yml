name: driver
on:
  push:
    branches: [main]
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  pull_request:
    paths: [ "driver/**", ".github/workflows/driver.yml" ]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, so the rolling release is never half replaced.
concurrency: driver-${{ github.ref }}

jobs:
  build:
    # The display driver needs Visual Studio and the Windows Driver Kit (WDK) headers and libraries.
    # The windows-2022 runner image has both, but not the kit's Visual Studio extension, so the
    # project is a plain DLL project that adds the UMDF and IddCx paths itself (see the vcxproj).
    runs-on: windows-2022
    env:
      # 0.1.<run number>: monotonic, and stamped into the INF so Windows treats newer builds as upgrades.
      DRIVER_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build driver
        run: msbuild driver/ParkScreenIdd/ParkScreenIdd.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Stage the driver package
        # stampinf fills in the architecture, driver date and version, and the UMDF version
        # ($UMDFVERSION$).
        shell: pwsh
        run: |
          $out = "driver/ParkScreenIdd/x64/Release"
          $pkg = "$out/ParkScreenIdd"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$out/ParkScreenIdd.dll" $pkg
          Copy-Item "driver/ParkScreenIdd/ParkScreenIdd.inf" $pkg
          $stampinf = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin") -Recurse -Filter stampinf.exe |
            Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          if (-not $stampinf) { throw "stampinf.exe not found" }
          $date = (Get-Date).ToUniversalTime().ToString("MM/dd/yyyy")
          & $stampinf.FullName -f "$pkg/ParkScreenIdd.inf" -d $date -a amd64 -v "$env:DRIVER_VERSION.0" -u 2.25.0
          if ($LASTEXITCODE -ne 0) { throw "stampinf failed" }
          Get-Content "$pkg/ParkScreenIdd.inf" | Select-String "DriverVer", "UmdfLibraryVersion"
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Sign the driver (test certificate) and make the catalog
        # The DLL is signed first because the catalog holds its hash. The certificate is a
        # self-signed test certificate (driver/ParkScreenTest.cer holds the public half), so the
        # package only loads with Windows test-signing on. Real release signing needs Microsoft
        # attestation signing (see driver/README.md).
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.DRIVER_TEST_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.DRIVER_TEST_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Warning "No DRIVER_TEST_PFX_BASE64 secret (pull request from a fork?): skipping signing."
            exit 0
          }
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName | Select-Object -Last 1
          $inf2cat = Get-ChildItem $kits -Recurse -Filter Inf2Cat.exe | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found" }
          if (-not $inf2cat) { throw "Inf2Cat.exe not found" }
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "inf2cat:  $($inf2cat.FullName)"

          $pfx = Join-Path $env:RUNNER_TEMP "driver-test.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $pkg = (Resolve-Path "driver/ParkScreenIdd/x64/Release/ParkScreenIdd").Path

          function Sign($file) {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Sign "$pkg/ParkScreenIdd.dll"
          & $inf2cat.FullName /driver:$pkg /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed" }
          if (-not (Test-Path "$pkg/ParkScreenIdd.cat")) { throw "Inf2Cat did not produce ParkScreenIdd.cat" }
          Sign "$pkg/ParkScreenIdd.cat"
          Remove-Item $pfx -Force

          foreach ($f in "ParkScreenIdd.dll", "ParkScreenIdd.cat") {
            $s = Get-AuthenticodeSignature "$pkg/$f"
            Write-Host "$f signed by: $($s.SignerCertificate.Subject) (status $($s.Status))"
            if (-not $s.SignerCertificate) { throw "$f carries no signature" }
          }

      - name: Build the zip and manifest
        shell: pwsh
        run: |
          $pkg = (Resolve-Path "driver/ParkScreenIdd/x64/Release/ParkScreenIdd").Path
          Copy-Item "driver/ParkScreenTest.cer" $pkg
          Copy-Item "driver/install.ps1" $pkg
          $dist = Join-Path $env:RUNNER_TEMP "driver-dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $zip = Join-Path $dist "ParkScreenIdd.zip"
          Compress-Archive -Path "$pkg/ParkScreenIdd.dll", "$pkg/ParkScreenIdd.inf", "$pkg/ParkScreenIdd.cat", "$pkg/ParkScreenTest.cer", "$pkg/install.ps1" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version    = $env:DRIVER_VERSION
            url        = "https://github.com/${{ github.repository }}/releases/download/driver/ParkScreenIdd.zip"
            sha256     = $sha
            testSigned = $true
            minHost    = "0.1.9"
          }
          ($manifest | ConvertTo-Json -Compress) | Set-Content (Join-Path $dist "driver-manifest.json") -Encoding ASCII
          Get-Content (Join-Path $dist "driver-manifest.json")
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object { "$($_.FullName)  $($_.Length)" }
          "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: parkscreen-idd-test-signed
          path: |
            ${{ env.DIST }}
            driver/ParkScreenIdd/x64/Release/ParkScreenIdd.pdb
          if-no-files-found: error

      - name: Publish the rolling "driver" release
        # Only from main (never a pull request); the host app reads driver-manifest.json from here.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Test-signed ParkScreen display driver $env:DRIVER_VERSION (built from $env:GITHUB_SHA). Loads only with Windows test-signing on. See driver/README.md."
          gh release view driver --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create driver --repo $env:GITHUB_REPOSITORY --title "ParkScreen display driver (test-signed)" --notes $notes --latest=false --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          } else {
            gh release edit driver --repo $env:GITHUB_REPOSITORY --title "ParkScreen display driver (test-signed)" --notes $notes --prerelease=false --latest=false
          }
          gh release upload driver --repo $env:GITHUB_REPOSITORY --clobber "$env:DIST/ParkScreenIdd.zip" "$env:DIST/driver-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "could not upload the assets" }
